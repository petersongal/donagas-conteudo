name: Fábrica de Reels

# Transforma reels/roteiros/*.json em vídeos (posts/<id>/reel.mp4 + capa.jpg) e agenda no agenda.json.
# Precisa do segredo FAL_KEY (Settings › Secrets and variables › Actions). Sem ele, roda em modo teste e não publica nada.
on:
  push:
    branches: [main]
    paths: ["reels/roteiros/**", "reels/fabrica.py"]
  schedule:
    - cron: "17 13 * * *"   # 10h17 de Brasília: pega roteiros que ficaram para trás
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabrica-reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright pillow requests
          python -m playwright install --with-deps chromium >/dev/null
          cd gerador && npm i --silent @fontsource/nunito
      - name: Produzir Reels
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python reels/fabrica.py
      - name: Salvar no repositório
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [ -z "$FAL_KEY" ]; then echo "Modo teste: nada é salvo."; exit 0; fi
          git config user.name "fabrica-reels"
          git config user.email "fabrica-reels@users.noreply.github.com"
          git add agenda.json posts/*/reel.mp4 posts/*/capa.jpg 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Reels produzidos pela fábrica"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
