name: Relatório do Instagram

# Baixa os números dos posts (publicador do App Dona Gás) e guarda em metricas/relatorio.json,
# para a análise de 5 dias e para conferir se cada post saiu.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/relatorio.yml"]

permissions:
  contents: write

concurrency:
  group: relatorio-instagram
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar relatório
        run: |
          mkdir -p metricas
          curl -sf -m 60 "https://ocjrttaavhjiwugunrrj.supabase.co/functions/v1/instagram-publisher?relatorio=1" -o /tmp/r.json
          python3 -c "import json;d=json.load(open('/tmp/r.json'));print(d.get('gerado_em'), len(d.get('posts',[])), 'posts publicados')"
          python3 -c "import json;d=json.load(open('/tmp/r.json'));json.dump(d,open('metricas/relatorio.json','w'),ensure_ascii=False,indent=1)"
      - name: Salvar
        run: |
          git config user.name "relatorio-instagram"
          git config user.email "relatorio-instagram@users.noreply.github.com"
          git add metricas/relatorio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Relatório do Instagram"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 8; done
          exit 1
